name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0

      - name: Build wasm
        run: make -C wasm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wasm/dist-codeonly

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
