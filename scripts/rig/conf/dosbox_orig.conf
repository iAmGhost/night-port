[dosbox]
machine=svga_s3
memsize=16

[cpu]
core=normal
cycles=auto

[mixer]
rate=44100
blocksize=1024
prebuffer=20

[sdl]
fullscreen=false
window_size=640x480

[autoexec]
echo === NIGHT original, captured for port comparison ===
mount c ~/Git/night-port/NIGHT
imgmount d ~/Git/night-port/NIGHT/TG_NIGHT.CUE -t iso -useimgmode none
capto ~/Git/night-port/scratch/orig
capm
c:
night
