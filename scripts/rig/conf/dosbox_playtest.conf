[dosbox]
machine = svga_s3
memsize = 16

[cpu]
core = normal
cycles = auto

[capture]
capture_dir = ~/Git/night-port/scratch/orig
default_image_capture_formats = raw

[sdl]
fullscreen = false
window_size = 640x480

[autoexec]
mount c ~/Git/night-port/NIGHT
imgmount d ~/Git/night-port/NIGHT/TG_NIGHT.CUE -t iso
c:
autotype -w 3.0 -p 0.5 , , , , , , , , , , , , , , , , , , , , , , , enter
night
